[package]
name = "overprint"
version = "0.1.0"
edition = "2021"
# slice::as_chunks is stable from 1.88.
rust-version = "1.88"
description = "Two-ink risograph-style separation, dithering, mis-registration and grain, compiled to WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match the wasm-bindgen CLI version exactly (see README).
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
